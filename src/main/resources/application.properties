spring.application.name=tasktrack
server.port=8080

# Persistent file-based H2 database. Stored in ./data/tasktrack.mv.db
# (relative to the folder you start the app from). Delete ./data to reset.
spring.datasource.url=jdbc:h2:file:./data/tasktrack
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# H2 web console is OFF by default. For local debugging only, start with:
#   --spring.h2.console.enabled=true   then open /h2-console
spring.h2.console.enabled=false

# Never leak stack traces or internal messages in error responses.
server.error.include-stacktrace=never
server.error.include-message=never
