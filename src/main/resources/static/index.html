<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TaskTrack</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip-link" href="#task-list">Skip to task list</a>

  <header class="site-header">
    <div class="container">
      <h1>TaskTrack</h1>
      <p class="tagline">Keep track of what matters, one task at a time.</p>
    </div>
  </header>

  <main class="container">
    <!-- Success and error messages appear here -->
    <div id="message" class="message" role="status" aria-live="polite" hidden></div>

    <section aria-labelledby="summary-heading" class="summary">
      <h2 id="summary-heading" class="visually-hidden">Task summary</h2>
      <div class="summary-card">
        <span class="summary-number" id="count-total">0</span>
        <span class="summary-label">Total</span>
      </div>
      <div class="summary-card">
        <span class="summary-number" id="count-pending">0</span>
        <span class="summary-label">Pending</span>
      </div>
      <div class="summary-card">
        <span class="summary-number" id="count-completed">0</span>
        <span class="summary-label">Completed</span>
      </div>
    </section>

    <div class="layout">
      <section aria-labelledby="form-heading" class="panel">
        <h2 id="form-heading">Add a task</h2>
        <form id="task-form" novalidate>
          <fieldset id="form-fields">
            <legend class="visually-hidden">Task details</legend>

            <div class="field">
              <label for="title">Title <span class="required" aria-hidden="true">*</span></label>
              <input type="text" id="title" name="title" maxlength="100" required autocomplete="off">
            </div>

            <div class="field">
              <label for="description">Description</label>
              <textarea id="description" name="description" rows="3" maxlength="500"></textarea>
            </div>

            <div class="field-row">
              <div class="field">
                <label for="priority">Priority</label>
                <select id="priority" name="priority">
                  <option value="LOW">Low</option>
                  <option value="MEDIUM" selected>Medium</option>
                  <option value="HIGH">High</option>
                </select>
              </div>
              <div class="field">
                <label for="dueDate">Due date</label>
                <input type="date" id="dueDate" name="dueDate">
              </div>
            </div>

            <div class="form-actions">
              <button type="submit" id="submit-button" class="button button-primary">Add task</button>
              <button type="button" id="cancel-button" class="button" hidden>Cancel edit</button>
            </div>
          </fieldset>
        </form>
      </section>

      <section aria-labelledby="list-heading" class="panel">
        <div class="list-header">
          <h2 id="list-heading">Your tasks</h2>
          <div class="filters" role="group" aria-label="Filter tasks by status">
            <button type="button" class="filter-button is-active" data-filter="ALL" aria-pressed="true">All</button>
            <button type="button" class="filter-button" data-filter="PENDING" aria-pressed="false">Pending</button>
            <button type="button" class="filter-button" data-filter="COMPLETED" aria-pressed="false">Completed</button>
          </div>
        </div>

        <p id="loading" class="state-text" hidden>Loading tasks…</p>
        <p id="empty" class="state-text" hidden>No tasks to show.</p>
        <ul id="task-list" class="task-list" tabindex="-1"></ul>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">TaskTrack &middot; a Hack the Web open-source project</div>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
